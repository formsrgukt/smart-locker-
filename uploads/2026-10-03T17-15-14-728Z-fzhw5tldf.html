<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload to Private Drive</title>
<style>
  :root { --cycle: 7s; --ease: cubic-bezier(.4, 0, .2, 1); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f6f7f9; font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #101216; } }

  .upload {
    position: relative; width: 236px; height: 152px; padding: 0; border: 0; border-radius: 28px;
    background: #1a5cff; color: #fff; cursor: pointer; overflow: hidden; isolation: isolate;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 10px 24px rgba(26,92,255,.35);
    transition: transform .15s var(--ease), box-shadow .25s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .upload:hover { box-shadow: 0 14px 30px rgba(26,92,255,.45); }
  .upload:active { transform: scale(.97); }
  .upload:focus-visible { outline: 3px solid #fff; outline-offset: -6px; }

  /* One shared timeline (--cycle). Story:
     0-10%  idle (original button)
     14-36% a document rises and slides into the drive, progress fills
     44-52% lock badge pops in and the shackle closes
     49-82% "Saved to Private Drive"
     90-100% back to idle */

  /* Background glow when the file is secured */
  .glow {
    position: absolute; z-index: -1; inset: 0; opacity: 0;
    background: radial-gradient(circle at 50% 36%, rgba(255,255,255,.38), transparent 60%);
    animation: glow var(--cycle) var(--ease) infinite;
  }
  @keyframes glow { 0%, 44% { opacity: 0; } 52% { opacity: 1; } 68%, 100% { opacity: 0; } }

  .stage { display: grid; place-items: center; width: 80px; height: 60px; }
  .stage > * { grid-area: 1 / 1; }

  /* Idle icon */
  .circle {
    width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.2);
    display: grid; place-items: center; animation: circleVis var(--cycle) var(--ease) infinite;
  }
  .circle svg { width: 26px; height: 26px; }
  .circle path { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes circleVis {
    0%, 8% { opacity: 1; transform: scale(1); } 12%, 88% { opacity: 0; transform: scale(.6); }
    94%, 100% { opacity: 1; transform: scale(1); }
  }

  /* Scene: document -> drive -> lock */
  .scene { display: grid; place-items: center; opacity: 0; animation: sceneVis var(--cycle) var(--ease) infinite; }
  .scene > * { grid-area: 1 / 1; position: relative; }
  @keyframes sceneVis { 0%, 10% { opacity: 0; } 14%, 84% { opacity: 1; } 90%, 100% { opacity: 0; } }

  .drive {
    z-index: 2; width: 62px; height: 42px; border-radius: 11px;
    background: #4d84ff; border: 1.5px solid rgba(255,255,255,.7);
    animation: drivePulse var(--cycle) var(--ease) infinite;
  }
  @keyframes drivePulse { 0%, 34% { transform: scale(1); } 38% { transform: scale(1.07); } 44%, 100% { transform: scale(1); } }
  .slot { position: absolute; top: 9px; left: 10px; right: 10px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.75); }
  .track { position: absolute; bottom: 9px; left: 10px; width: 30px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
  .fill { height: 100%; background: #fff; transform: scaleX(0); transform-origin: left; animation: fill var(--cycle) var(--ease) infinite; }
  @keyframes fill { 0%, 17% { transform: scaleX(0); } 36%, 100% { transform: scaleX(1); } }
  .led { position: absolute; bottom: 8.5px; right: 11px; width: 5px; height: 5px; border-radius: 50%; background: #fff; opacity: .5; animation: led var(--cycle) ease infinite; }
  @keyframes led { 0%, 16% { opacity: .5; } 22% { opacity: 1; } 28% { opacity: .5; } 34% { opacity: 1; } 40%, 100% { opacity: .5; } }

  .doc {
    z-index: 1; width: 22px; height: 28px; border-radius: 4px; background: #fff; opacity: 0;
    animation: doc var(--cycle) var(--ease) infinite;
  }
  .doc::before {
    content: ""; position: absolute; left: 5px; right: 5px; top: 8px; height: 2px; border-radius: 1px;
    background: rgba(26,92,255,.4); box-shadow: 0 5px 0 rgba(26,92,255,.4), 0 10px 0 rgba(26,92,255,.4);
  }
  @keyframes doc {
    0%, 12% { opacity: 0; transform: translateY(46px); }
    17% { opacity: 1; transform: translateY(40px); }
    36% { opacity: 1; transform: translateY(0); }
    38%, 100% { opacity: 0; transform: translateY(0); }
  }

  .lock {
    z-index: 3; justify-self: end; align-self: end; margin: 0 -2px -4px 0;
    width: 24px; height: 24px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.22); transform: scale(0); animation: lockPop var(--cycle) var(--ease) infinite;
  }
  @keyframes lockPop { 0%, 43% { transform: scale(0); } 48% { transform: scale(1.12); } 51%, 100% { transform: scale(1); } }
  .lock svg { width: 14px; height: 14px; overflow: visible; }
  .lock .body { fill: #1a5cff; }
  .lock .shackle { fill: none; stroke: #1a5cff; stroke-width: 2.2; stroke-linecap: round; transform-box: fill-box; animation: shackle var(--cycle) var(--ease) infinite; }
  @keyframes shackle { 0%, 49% { transform: translateY(-2.5px); } 54%, 100% { transform: translateY(0); } }

  /* Labels: Upload Document -> Uploading… -> Saved to Private Drive */
  .labels { display: grid; place-items: center; width: 200px; height: 48px; }
  .labels span { grid-area: 1 / 1; font-size: 18px; font-weight: 700; line-height: 1.3; text-align: center; letter-spacing: .1px; }
  .l-idle { animation: lIdle var(--cycle) var(--ease) infinite; }
  .l-up { opacity: 0; animation: lUp var(--cycle) var(--ease) infinite; }
  .l-saved { opacity: 0; animation: lSaved var(--cycle) var(--ease) infinite; }
  @keyframes lIdle { 0%, 8% { opacity: 1; } 11%, 89% { opacity: 0; } 94%, 100% { opacity: 1; } }
  @keyframes lUp { 0%, 13% { opacity: 0; } 16%, 37% { opacity: 1; } 40%, 100% { opacity: 0; } }
  @keyframes lSaved { 0%, 45% { opacity: 0; } 49%, 82% { opacity: 1; } 86%, 100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .glow, .circle, .scene, .drive, .fill, .led, .doc, .lock, .shackle, .labels span { animation: none; }
  }
</style>
</head>
<body>

<button class="upload" type="button" aria-label="Upload document to your private drive">
  <span class="glow"></span>

  <span class="stage">
    <span class="circle">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/><path d="M12 15V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/>
      </svg>
    </span>

    <span class="scene" aria-hidden="true">
      <span class="doc"></span>
      <span class="drive">
        <span class="slot"></span>
        <span class="track"><span class="fill"></span></span>
        <span class="led"></span>
      </span>
      <span class="lock">
        <svg viewBox="0 0 24 24">
          <path class="shackle" d="M8 11V8a4 4 0 018 0v3"/>
          <rect class="body" x="5" y="11" width="14" height="10" rx="2.5"/>
        </svg>
      </span>
    </span>
  </span>

  <span class="labels">
    <span class="l-idle">Upload<br>Document</span>
    <span class="l-up">Uploading…</span>
    <span class="l-saved">Saved to<br>Private Drive</span>
  </span>
</button>

</body>
</html>
